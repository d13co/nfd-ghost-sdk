name: nfd-ghost-sdk

# CI for main, and the npm release of nfd-ghost-sdk: pushing a v<version> tag
# (v2.0.0-dt.6) on main tests, packs and publishes it. See RELEASING.md.
on:
  push:
    branches: [main]
    tags: ['v*-dt.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfd-ghost-sdk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: projects/sdk

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the 24 run packs the release
        node: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          }

      # Needs no install, so a mistagged release fails before the tests
      - name: Check the version, the forks, the README and the tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release.mjs check "$TAG"

      - name: Use pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: projects/sdk/package.json
          cache: true
          cache_dependency_path: projects/sdk/pnpm-lock.yaml

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

      # Regenerates src/generated/reader.ts from the committed NfdQueryReader spec, then compiles dist/
      - name: Build
        run: pnpm build

      - name: Check the reader is up to date
        run: |
          git diff --exit-code -- src/generated || {
            echo "::error::src/generated/reader.ts is out of date with the NfdQueryReader spec: run pnpm build and commit it"
            exit 1
          }

      # Apps bundle the SDK for the browser
      - name: Check dist/ is browser-safe
        run: pnpm check-dist

      # Unit tests; the integration tests skip without a dtalgod (ALGOD_SERVER, ALGOD_PORT)
      - name: Test
        run: pnpm test

      # Packs the tested dist/, so the publish job publishes exactly this tarball
      - name: Pack
        if: github.ref_type == 'tag' && matrix.node == '24.x'
        run: pnpm pack

      - name: Upload package
        if: github.ref_type == 'tag' && matrix.node == '24.x'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: projects/sdk/nfd-ghost-sdk-*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    # One publish at a time across tags, so the last tag pushed is the one `latest` ends on
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    # The trusted publisher on npmjs.com names this environment. Its required reviewers
    # approve each release, and its deployment policy admits only v*-dt.* tags.
    environment:
      name: npm
      url: https://www.npmjs.com/package/nfd-ghost-sdk/v/${{ steps.version.outputs.version }}
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or later
      - name: Check npm version
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)))) process.exit(0);
            console.error("::error::npm " + process.argv[1] + " is older than 11.5.1, which trusted publishing needs");
            process.exit(1);
          ' "$(npm -v)"

      - name: Read version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package
          path: package

      # Authenticates with npm trusted publishing (OIDC), which also adds provenance;
      # there is no token. The versions are prereleases, and npm 11 publishes a
      # prerelease only with an explicit --tag. The ./ matters: npm reads
      # package/<file>.tgz as the GitHub repository package/<file>.tgz.
      # A version already on npm (the first one, published by hand) is not published
      # again, and the GitHub release gets npm's tarball in place of the rebuilt one.
      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "nfd-ghost-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::nfd-ghost-sdk@$VERSION is already on npm, not publishing it again"
            rm -f package/*.tgz
            npm pack "nfd-ghost-sdk@$VERSION" --pack-destination package
          else
            npm publish "./package/nfd-ghost-sdk-$VERSION.tgz" --tag latest --access public
          fi

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::The $GITHUB_REF_NAME release already exists"
            exit 0
          fi
          {
            echo "npm: [nfd-ghost-sdk@$VERSION](https://www.npmjs.com/package/nfd-ghost-sdk/v/$VERSION). It needs a dtalgod and the dtalgorand forks: see [Requirements](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/projects/sdk/README.md#requirements)."
            prev=$(git describe --tags --abbrev=0 --match 'v*-dt.*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo
              echo "## Changes since $prev"
              echo
              git log --first-parent --format='- %s (%h)' "$prev..$GITHUB_REF_NAME"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "package/nfd-ghost-sdk-$VERSION.tgz" \
            --verify-tag --latest --title "nfd-ghost-sdk $VERSION" --notes-file notes.md
